name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structure, privacy and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2 pytest==8.3.4
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.303
      - name: Official plugin validator
        run: |
          claude plugin validate . --strict
          for d in *-plugin; do claude plugin validate "./$d"; done
      - name: Marketplace validator
        run: python validate_marketplace.py
      - name: Per-plugin validator
        run: for d in *-plugin; do python validate_plugin.py "$d" || exit 1; done
      - name: Eval case validator
        run: python validate_evals.py
      - name: Vendored hooklib is in sync
        run: python tools/sync_vendor.py --check
      - name: No personal data in tracked files
        run: python tools/check_privacy.py
      - name: README version table matches plugin.json
        run: python tools/readme_versions.py --check
      - name: Wiki plugin catalog matches the plugin files
        run: python tools/wiki_catalog.py --check
      - name: Every changed plugin bumped its version
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_version_bump.py "$BASE" HEAD
      - name: Secret scan (tracked tree)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  tests:
    name: Tests and hook smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2 pytest==8.3.4
      - name: Offline test suites
        run: |
          status=0
          python -m pytest -q -p no:cacheprovider shared/tests || status=1
          for d in *-plugin; do
            [ -d "$d/tests" ] || continue
            echo "::group::$d"
            (cd "$d" && python -m pytest -q -p no:cacheprovider) || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Every registered hook launches and fails open
        run: python tools/hook_smoke.py
